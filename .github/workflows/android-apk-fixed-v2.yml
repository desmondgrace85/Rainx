name: Build RainX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify tools
        run: |
          node --version
          pnpm --version
          java -version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Capacitor Android project
        run: pnpm mobile:prepare

      - name: Verify Android project
        working-directory: artifacts/rainx/android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -d app

      - name: Build debug APK
        working-directory: artifacts/rainx/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RainX-Android-debug
          path: artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
