name: Build RainX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          java -version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build RainX only
        run: pnpm --filter @workspace/rainx build

      - name: Verify RainX web build
        run: test -f artifacts/rainx/dist/public/index.html

      - name: Add Android platform if needed
        working-directory: artifacts/rainx
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Sync Capacitor Android
        working-directory: artifacts/rainx
        run: pnpm exec cap sync android

      - name: Verify Android project
        run: |
          test -f artifacts/rainx/android/gradlew
          test -f artifacts/rainx/android/gradle/wrapper/gradle-wrapper.properties
          test -d artifacts/rainx/android/app

      - name: Build APK
        working-directory: artifacts/rainx/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RainX-Android-debug
          path: artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
