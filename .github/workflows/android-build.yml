name: Build RainX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm MUST be installed before setup-node when package.json declares
      # a packageManager field; setup-node may otherwise try to locate pnpm
      # for its automatic cache and fail before pnpm exists.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Verify pnpm
        run: pnpm --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build RainX only
        run: pnpm --filter @workspace/rainx build

      - name: Verify RainX build
        run: test -f artifacts/rainx/dist/public/index.html

      - name: Generate Capacitor Android project
        working-directory: artifacts/rainx
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Patch Android manifest for camera/microphone permissions
        working-directory: artifacts/rainx
        run: python3 ../../scripts/patch-android-permissions.py

      - name: Add Firebase Android configuration
        working-directory: artifacts/rainx
        run: |
          test -f google-services.json
          test -d android/app
          cp google-services.json android/app/google-services.json
          test -f android/app/google-services.json
          grep -q '"package_name": "com.rainx.app"' android/app/google-services.json

      - name: Apply Firebase Google Services plugin
        working-directory: artifacts/rainx
        run: |
          grep -q "com.google.gms:google-services" android/build.gradle || sed -i "/classpath 'com.android.tools.build:gradle:/a\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || printf "\napply plugin: 'com.google.gms.google-services'\n" >> android/app/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle

      - name: Sync Capacitor Android
        working-directory: artifacts/rainx
        run: pnpm exec cap sync android

      - name: Verify Android project and Firebase
        run: |
          test -x artifacts/rainx/android/gradlew || chmod +x artifacts/rainx/android/gradlew
          test -f artifacts/rainx/android/gradle/wrapper/gradle-wrapper.properties
          test -f artifacts/rainx/android/app/google-services.json
          grep -q '"package_name": "com.rainx.app"' artifacts/rainx/android/app/google-services.json

      - name: Build APK
        working-directory: artifacts/rainx/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RainX-Android-debug
          path: artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
