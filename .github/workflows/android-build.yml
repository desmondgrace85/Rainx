name: Build RainX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build RainX only
        run: pnpm --filter @workspace/rainx build

      - name: Verify RainX build
        run: test -f artifacts/rainx/dist/public/index.html

      - name: Generate Capacitor Android project
        working-directory: artifacts/rainx
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Add Firebase Android configuration
        working-directory: artifacts/rainx
        run: |
          test -f google-services.json
          test -f android/build.gradle
          test -d android/app
          cp google-services.json android/app/google-services.json
          test -f android/app/google-services.json
          grep -q 'com.rainx.app' android/app/google-services.json

      - name: Sync Capacitor Android
        working-directory: artifacts/rainx
        run: pnpm exec cap sync android

      - name: Verify Android project and Firebase
        run: |
          test -f artifacts/rainx/android/gradlew
          test -f artifacts/rainx/android/gradle/wrapper/gradle-wrapper.properties
          test -f artifacts/rainx/android/app/google-services.json
          grep -q 'com.rainx.app' artifacts/rainx/android/app/google-services.json

      - name: Build APK
        working-directory: artifacts/rainx/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -s artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RainX-Android-debug
          path: artifacts/rainx/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
